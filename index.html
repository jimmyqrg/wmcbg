<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    font-family: Comic Sans MS, sans-serif;
    background: #f0f0f0;
  }

  .box {
    width: 300px;
    padding: 20px;
    margin: 40px auto;
    background: white;
    border-radius: 15px;
    border: 3px solid #777;
    text-align: center;
    position: relative;
    transition: transform 0.6s ease;
  }

  /* Page turn animation (only the box) */
  .page-turn {
    transform: rotateY(90deg);
  }

  button {
    font-size: 20px;
    padding: 10px 20px;
    cursor: pointer;
    margin-top: 15px;
  }

  .hidden-btn {
    display: none;
    margin-top: 20px;
  }

  /* Level 5 page extension */
  #level5-space {
    height: 2000px;
    display: none;
    background: linear-gradient(white, #ddd);
  }

  #bottom-btn {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    padding: 15px 25px;
    font-size: 22px;
  }
</style>
</head>
<body>

<div class="box" id="box">
  <h2 id="levelText">Level 1</h2>
  <button id="mainBtn">FREEZE</button>
  <button id="hiddenBtn" class="hidden-btn">YOU WIN</button>
</div>

<div id="level5-space">
  <button id="bottom-btn">REAL BUTTON</button>
</div>

<script>
let level = 1;
const box = document.getElementById("box");
const mainBtn = document.getElementById("mainBtn");
const hiddenBtn = document.getElementById("hiddenBtn");
const bottomBtn = document.getElementById("bottom-btn");
const space5 = document.getElementById("level5-space");

function nextLevel() {
  box.classList.add("page-turn");
  setTimeout(() => {
    level++;
    loadLevel();
    box.classList.remove("page-turn");
  }, 600);
}

function loadLevel() {
  document.getElementById("levelText").textContent = "Level " + level;

  /* Reset */
  mainBtn.style.display = "inline-block";
  hiddenBtn.style.display = "none";
  box.style.position = "relative";
  box.style.left = "0px";
  box.style.top = "0px";
  box.style.cursor = "default";
  space5.style.display = "none";
  bottomBtn.style.display = "none";

  /* LEVELS 1–3 stay EXACTLY the same as original */
  if (level === 1) {
    mainBtn.textContent = "FREEZE";
    mainBtn.onclick = () => nextLevel();
  }

  if (level === 2) {
    mainBtn.textContent = "FREEZE";
    mainBtn.onclick = () => alert("You missed!");
    box.onmouseenter = () => nextLevel();
  }

  if (level === 3) {
    mainBtn.textContent = "FREEZE";
    mainBtn.onclick = () => {
      mainBtn.style.position = "absolute";
      mainBtn.style.left = Math.random() * 200 + "px";
      mainBtn.style.top = Math.random() * 150 + "px";
    };
    hiddenBtn.textContent = "LEVEL PASSED";
    hiddenBtn.style.display = "block";
    hiddenBtn.onclick = () => nextLevel();
  }

  /* --- LEVEL 4 --- */
  if (level === 4) {
    mainBtn.textContent = "LAVA";
    mainBtn.onclick = () => alert("You cannot freeze LAVA!");

    hiddenBtn.textContent = "LEVEL PASSED";
    hiddenBtn.style.display = "block";

    // Hidden button moves with the box (inside)
    hiddenBtn.style.position = "absolute";
    hiddenBtn.style.bottom = "10px";
    hiddenBtn.style.left = "50%";
    hiddenBtn.style.transform = "translateX(-50%)";

    // Make the entire box draggable
    let dragging = false, offsetX, offsetY;

    box.onmousedown = (e) => {
      dragging = true;
      offsetX = e.clientX - box.offsetLeft;
      offsetY = e.clientY - box.offsetTop;
      box.style.cursor = "grabbing";
    };

    document.onmousemove = (e) => {
      if (dragging) {
        box.style.position = "absolute";
        box.style.left = (e.clientX - offsetX) + "px";
        box.style.top = (e.clientY - offsetY) + "px";
      }
    };

    document.onmouseup = () => {
      dragging = false;
      box.style.cursor = "grab";
    };

    hiddenBtn.onclick = () => nextLevel();
  }

  /* --- LEVEL 5 --- */
  if (level === 5) {
    mainBtn.textContent = "FREEZE";

    // Teleport instantly
    mainBtn.onclick = () => {
      mainBtn.style.position = "absolute";
      mainBtn.style.left = "-5000px";
    };

    // Entire page becomes scrollable
    space5.style.display = "block";

    // Real bottom button
    bottomBtn.style.display = "block";
    bottomBtn.onclick = () => nextLevel();
  }
}

loadLevel();
</script>

</body>
</html>
