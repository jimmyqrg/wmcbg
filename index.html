<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>World's Most Confusing Button</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <button id="hiddenBtn" class="btn hidden-btn">REAL BUTTON??</button>

  <div id="stage" class="stage" tabindex="0">

    <div id="levelPassedMsg">LEVEL PASSED!</div>
    <div class="ui" id="ui">Level 1</div>

    <button id="mainBtn" class="btn">CLICK ME</button>

    <div id="dropZone"></div>

    <div id="ctx" class="ctxmenu">
      <button id="freezeOpt">Freeze the button</button>
    </div>

  </div>
</div>

<div id="finalArea" class="final-area">
  <div class="final-spacer"></div>
  <button id="finalBtn" class="btn final-btn">I WAS HIDING DOWN HERE</button>
</div>

<script src="script.js"></script>

</body>
</html>
