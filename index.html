<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>World's Most Confusing Button</title>
<style>
  :root{ --w:800px; --h:600px; }
  html,body{height:100%; margin:0; font-family: Arial, Helvetica, sans-serif;}
  body{
    cursor:grab; user-select:none; -webkit-user-select:none; -moz-user-select:none;
    background: #fffced;
    background-image: linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
    background-size: 100% 30px;
  }
  .wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .stage{
    width:var(--w); height:var(--h); background:transparent; position:relative; overflow:hidden;
    border:1px solid #eee; box-shadow:0 6px 24px rgba(0,0,0,0.08);
  }
  .btn {
    position:absolute; left:50%; transform:translate(-50%,-50%);
    top:50%;
    background: linear-gradient(#ff9a3c,#f36a00);
    color:white; font-weight:bold; border:none; padding:14px 26px; border-radius:10px;
    cursor:grab; box-shadow:0 6px 14px rgba(0,0,0,0.15); transition:transform .12s, top .5s ease;
    user-select:none;
  }
  .btn:active{ transform:translate(-50%,-50%) scale(.98); }
  .ui { position:absolute; left:12px; top:12px; z-index:50; font-size:14px; color:#333; }
  .hotspot { position:absolute; width:40px;height:10px; background:transparent; bottom:6px; transform:translateX(-50%); pointer-events:auto; }
  .ctxmenu{
    position:fixed; z-index:300; background:#fff; border:1px solid #ccc; padding:8px; border-radius:6px;
    display:none; box-shadow:0 8px 24px rgba(0,0,0,0.12);
  }
  .ctxmenu button{ background:transparent;border:none;padding:6px 8px;font-weight:bold;cursor:pointer; }
  .white-scene{
    position:absolute; inset:0; background:white; z-index:40; cursor:grab;
    touch-action: none;
  }
  .under-bg{ position:absolute; inset:0; background:black; z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .under-btn{
    margin-bottom:10px; background:#4CAF50; color:white; padding:12px 18px; border-radius:8px; border:none;
  }
  .tall { height:200vh; width:100%; position:relative; }
  .stone { background:linear-gradient(#9e9e9e,#707070) !important; color:#eee !important; }
  .lava { background: linear-gradient(#ff4a1c,#b20000) !important; color:#fff !important; }
  .finished {
    position:absolute; inset:0; display:flex;align-items:center;justify-content:center; background:rgba(0,0,0,.6); z-index:500;
    color:white; font-size:28px; font-weight:700;
  }
  #level4Reset {
    position:absolute; left:12px; bottom:12px; z-index:450; padding:8px 12px; background:#222; color:#fff; border-radius:6px; border:none; display:none; cursor:grab;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="stage" class="stage" tabindex="0">
    <div class="ui" id="ui">Level 1</div>

    <div class="under-bg" id="underBg" style="display:none;">
      <button id="underBtn" class="under-btn">Hidden Ground Button</button>
    </div>

    <div id="whiteScene" class="white-scene" style="display:none;"></div>

    <button id="mainBtn" class="btn">CLICK ME</button>

    <div id="hotspot" class="hotspot" style="display:none"></div>

    <div id="tall" class="tall" style="display:none"></div>

    <div id="ctx" class="ctxmenu"><button id="freezeOpt">Freeze the button</button></div>

    <div id="finished" class="finished" style="display:none;">You beat the World's Most Confusing Button 🎉</div>

    <button id="level4Reset">Reset Level 4</button>
  </div>
</div>

<script>
const stage = document.getElementById('stage');
const btn = document.getElementById('mainBtn');
const ui = document.getElementById('ui');
const hotspot = document.getElementById('hotspot');
const ctx = document.getElementById('ctx');
const freezeOpt = document.getElementById('freezeOpt');
const underBg = document.getElementById('underBg');
const whiteScene = document.getElementById('whiteScene');
const underBtn = document.getElementById('underBtn');
const tall = document.getElementById('tall');
const finished = document.getElementById('finished');
const level4Reset = document.getElementById('level4Reset');

let level = 1;
let frozen = false;
let moving = false;
let level3MovingInterval = null;
let level4FrozenStone = false;
let menuOpen = false;
let dragActive = false;
let dragOrigin = null;
let whiteOffset = {x:0,y:0};

function setLevel(n){
  level = n;
  ui.textContent = 'Level ' + level;
  frozen = false;
  moving = false;
  clearInterval(level3MovingInterval);
  level3MovingInterval = null;
  level4FrozenStone = false;
  level4Reset.style.display = 'none';
  btn.style.transition = 'none';
  btn.classList.remove('stone','lava');
  btn.disabled = false;
  btn.style.display = 'block';
  btn.style.left = '50%';
  btn.style.top = '50%';
  btn.style.transform = 'translate(-50%,-50%)';
  whiteScene.style.display = 'none';
  underBg.style.display = 'none';
  hotspot.style.display = 'none';
  tall.style.display = 'none';

  switch(level){
    case 1:
      btn.textContent = 'CLICK ME';
      break;
    case 2:
      btn.textContent = 'CLICK ME';
      setupLevel2();
      break;
    case 3:
      btn.textContent = 'CLICK ME';
      setupLevel3();
      break;
    case 4:
      setupLevel4();
      break;
    case 5:
      setupLevel5();
      break;
    default:
      finished.style.display = 'flex';
  }
}

/* Level 2 setup */
function setupLevel2(){
  btn.dataset.landed = 'false';
  const s = stage.getBoundingClientRect();
  btn.style.left = (s.width*0.5)+'px';
  btn.style.top = (s.height*0.25)+'px';
  btn.style.transform = 'translate(-50%,-50%)';
  btn.style.position = 'absolute';
  hotspot.style.display = 'none';
}

/* Level 3 setup */
function setupLevel3(){
  frozen = false;
  moving = false;
  const s = stage.getBoundingClientRect();
  btn.style.left = (s.width*0.5)+'px';
  btn.style.top = (s.height*0.5)+'px';
  btn.classList.remove('stone','lava');
  btn.style.background = 'linear-gradient(#ff9a3c,#f36a00)';
  btn.textContent = 'CLICK ME';
}

/* teleport button for levels 3 and 4 */
function level3Teleport(e){
  if(frozen || menuOpen) return;
  const s = stage.getBoundingClientRect();
  const mouseX = e ? (e.clientX - s.left) : (s.width/2);
  const mouseY = e ? (e.clientY - s.top) : (s.height/2);
  const chooseSafe = ()=>{
    let x,y,tries=0;
    do { x = Math.random()*(s.width-80)+40; y=Math.random()*(s.height-80)+40; tries++; if(tries>40) break; } while(Math.hypot(x-mouseX,y-mouseY)<120);
    return {x,y};
  };
  const loc = chooseSafe();
  btn.style.transition='left 120ms, top 120ms';
  btn.style.left = loc.x+'px';
  btn.style.top = loc.y+'px';
  moving=true;
  let vx=(Math.random()-.5)*2,vy=(Math.random()-.5)*2;
  clearInterval(level3MovingInterval);
  level3MovingInterval=setInterval(()=>{
    if(frozen || menuOpen) return;
    const s2=stage.getBoundingClientRect();
    let cx=parseFloat(btn.style.left)||s2.width/2;
    let cy=parseFloat(btn.style.top)||s2.height/2;
    cx+=vx*6; cy+=vy*6;
    if(cx<40||cx>s2.width-40){vx=-vx; cx=Math.max(40,Math.min(cx,s2.width-40));}
    if(cy<40||cy>s2.height-40){vy=-vy; cy=Math.max(40,Math.min(cy,s2.height-40));}
    btn.style.left=cx+'px'; btn.style.top=cy+'px';
    vx+=(Math.random()-.5)*0.6; vy+=(Math.random()-.5)*0.6;
  },80);
}

/* right-click menu */
function showCtxMenu(x,y){ctx.style.display='block'; menuOpen=true; ctx.style.left=x+'px'; ctx.style.top=y+'px';}
function hideCtxMenu(){ctx.style.display='none'; menuOpen=false;}
window.addEventListener('contextmenu', e=>{ e.preventDefault(); if(level===3||level===4) showCtxMenu(e.clientX,e.clientY); });
window.addEventListener('pointerdown',()=>hideCtxMenu());

freezeOpt.addEventListener('click', (e)=>{
  e.stopPropagation();
  hideCtxMenu();
  frozen = true;

  if(level===3){
    // AFTER FREEZING: next click shows "Level Passed!" and advances
    btn.addEventListener('click', function goNextAfterFreeze(){
      btn.removeEventListener('click', goNextAfterFreeze);
      showLevelPassed(() => setLevel(4));
    });
  }

  if(level===4){
    level4FrozenStone=true;
    btn.classList.remove('lava');
    btn.classList.add('stone');
    btn.textContent='STONE';
    btn.disabled=true;
    setTimeout(()=>{ level4Reset.style.display='block'; },1000);
  }
});

/* Level 4 setup */
function setupLevel4(){
  whiteScene.style.display='block';
  underBg.style.display='flex';
  whiteScene.style.transform='translate(0px,0px)';
  whiteOffset={x:0,y:0};
  level4FrozenStone=false;
  frozen=false;
  moving=false;
  const s = stage.getBoundingClientRect();
  btn.style.left=(s.width*0.35)+'px';
  btn.style.top=(s.height*0.18)+'px';
  btn.classList.add('lava');
  btn.textContent='LAVA';
  underBtn.addEventListener('click',()=>setLevel(5));
}

/* Drag for level4 white scene */
whiteScene.addEventListener('pointerdown',(e)=>{ dragActive=true; whiteScene.setPointerCapture(e.pointerId); dragOrigin={x:e.clientX,y:e.clientY}; whiteScene.style.cursor='grabbing'; });
window.addEventListener('pointermove',(e)=>{ if(!dragActive)return; const dx=e.clientX-dragOrigin.x,dy=e.clientY-dragOrigin.y; whiteOffset.x+=dx; whiteOffset.y+=dy; whiteScene.style.transform=`translate(${whiteOffset.x}px,${whiteOffset.y}px)`; dragOrigin={x:e.clientX,y:e.clientY}; });
window.addEventListener('pointerup',(e)=>{ if(dragActive){ dragActive=false; whiteScene.releasePointerCapture&&whiteScene.releasePointerCapture(e.pointerId); whiteScene.style.cursor='grab'; } });

/* Level5 setup */
function setupLevel5(){
  tall.style.display='block';
  const s = stage.getBoundingClientRect();
  btn.style.left=(s.width*0.5)+'px';
  btn.style.top=(s.height*0.3)+'px';
  btn.textContent='FINAL BUTTON';
  btn.style.background='linear-gradient(#ff9a3c,#f36a00)';
  btn.disabled=false;
  btn.addEventListener('pointerenter', ()=>{
    if(level!==5) return;
    btn.style.display='none';
    createBottomRevealButton();
  },{once:true});
}

function createBottomRevealButton(){
  if(document.getElementById('bottomRevealBtn')) return;
  const b=document.createElement('button');
  b.id='bottomRevealBtn';
  b.textContent='BOTTOM BUTTON (CLICK TO FINISH)';
  b.style.position='absolute';
  b.style.left='50%';
  b.style.transform='translate(-50%,0)';
  b.style.bottom='6px';
  b.style.padding='10px 16px';
  b.style.borderRadius='8px';
  b.style.background='linear-gradient(#4CAF50,#2E7D32)';
  b.style.color='white';
  b.style.border='none';
  b.style.zIndex=40;
  b.style.display='none';
  stage.appendChild(b);
  b.addEventListener('click',()=>{ if(level===5) finishGame(); b.style.display='none'; });
  b.style.display='block';
}

/* Finish game */
function finishGame(){ finished.style.display='flex'; }

/* Show Level Passed message */
function showLevelPassed(callback){
  const msg = document.createElement('div');
  msg.textContent = 'Level Passed!';
  msg.style.position = 'absolute';
  msg.style.left = '50%';
  msg.style.top = '20%';
  msg.style.transform = 'translate(-50%, -50%)';
  msg.style.fontSize = '24px';
  msg.style.fontWeight = 'bold';
  msg.style.color = '#4CAF50';
  msg.style.background = 'rgba(255,255,255,0.8)';
  msg.style.padding = '10px 18px';
  msg.style.borderRadius = '8px';
  msg.style.zIndex = '200';
  stage.appendChild(msg);

  setTimeout(()=>{
    msg.remove();
    if(callback) callback();
  }, 1000);
}

/* MINIMAL FIX: universal click handler */
btn.addEventListener('click', ()=>{
  if(level===1){
    setLevel(2);
  } else if(level===2){
    const s = stage.getBoundingClientRect();
    if(btn.dataset.landed === 'false'){
      btn.style.transition = 'top 0.5s ease';
      btn.style.top = (s.height - 40) + 'px';
      btn.dataset.landed = 'true';
      return;
    } else {
      showLevelPassed(() => setLevel(3));
    }
  } else if(level===3){
    if(!frozen) level3Teleport();
  }
});

setLevel(1);
</script>
</body>
</html>
