<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>World's Most Confusing Button</title>
<link rel="icon" href="favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Protest+Riot&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="screen home-screen" id="homeScreen">
  <div class="home-card">
    <h1 class="home-title">WORLD'S MOST CONFUSING BUTTON</h1>
    <p class="home-subtitle">MADE BY JIMMYQRG</p>
    <button id="startBtn" class="btn menu-btn">START</button>
  </div>
</div>

<div class="screen level-select-screen hidden" id="levelSelectScreen">
  <button id="backHomeBtn" class="back-btn" aria-label="Back to home">&larr; BACK</button>
  <div class="levels-card">
    <h2 class="levels-title">SELECT LEVEL</h2>
    <div id="levelsGrid" class="levels-grid"></div>
  </div>
</div>

<div class="screen game-screen hidden" id="gameScreen">
  <div class="wrap">
    <div id="stage" class="stage" tabindex="0">
      <div class="ui-bar">
        <div class="ui" id="ui">Level 1</div>
        <button id="uiHomeBtn" class="ui-icon-btn" aria-label="Home"><img src="home.png" alt="Home"></button>
        <button id="uiRestartBtn" class="ui-icon-btn" aria-label="Restart"><img src="restart.png" alt="Restart"></button>
      </div>

      <button id="mainBtn" class="btn">CLICK ME</button>

      <!-- Level 4: counter -->
      <div id="l4Area" class="l4-area hidden">
        <p class="l4-instruction">CLICK ON THE NUMBER TO INCREASE IT.</p>
        <button id="l4CounterBtn" class="btn l4-counter-btn">0/10000</button>
      </div>

      <!-- Level 6 -->
      <div id="l6Area" class="l6-area hidden">
        <p class="l6-text">IS THERE NO <span id="l6Link" class="l6-link">NEXT LEVEL</span>?</p>
      </div>

      <!-- Level 7 -->
      <div id="l7Area" class="l7-area hidden">
        <button id="l7Btn" class="btn l7-btn-normal">CLICK ME</button>
        <div id="l7Speech" class="speech-box l7-speech" aria-live="polite">
          <span class="l7-char">C</span><span class="l7-char">O</span><span class="l7-char">N</span><span class="l7-char">T</span><span class="l7-char">R</span><span class="l7-char">I</span><span class="l7-char">B</span><span class="l7-char">U</span><span class="l7-char">T</span><span class="l7-char">E</span>
          <span class="l7-space"> </span>
          <span class="l7-word">YOUR</span>
          <span class="l7-space"> </span>
          <span class="l7-word">MONEY!</span>
        </div>
        <div id="l7MoneyBar" class="l7-money-bar hidden">
          <span id="l7MoneyDisplay" class="l7-money">$5412950</span>
          <button id="l7ContributeBtn" class="btn l7-contribute-btn">CONTRIBUTE</button>
        </div>
        <div id="l7FormedWord" class="l7-formed-word hidden"></div>
      </div>

      <!-- Level 8 -->
      <div id="l8Area" class="l8-area hidden">
        <p class="l8-text">LOADING BUTTON</p>
        <div id="l8BarWrap" class="l8-bar-wrap">
          <div id="l8BarFill" class="l8-bar-fill"></div>
          <span id="l8BarLabel" class="l8-bar-label">0%</span>
        </div>
        <button id="l8DoneBtn" class="btn l8-done-btn hidden">CLICK ME</button>
      </div>

      <!-- Level 9 -->
      <div id="l9Area" class="l9-area hidden">
        <p id="l9Text" class="l9-text">DON'T CLICK ANYTHING</p>
        <button id="l9ClickMeBtn" class="btn l9-btn hidden">CLICK ME</button>
        <button id="l9RealBtn" class="btn l9-btn hidden">REAL BUTTON</button>
      </div>
    </div>
  </div>

  <div id="ctx" class="ctxmenu">
    <button id="freezeOpt">Freeze the button</button>
    <button id="ctxRestartOpt">Restart</button>
  </div>

  <div id="stageCtx" class="ctxmenu">
    <button id="restartOpt">Restart</button>
    <button id="stageCtxLevelsOpt">Back to Levels</button>
  </div>

  <div id="l4Ctx" class="ctxmenu">
    <button id="l4PasteOpt">Paste</button>
    <button id="l4CtxRestartOpt">Restart</button>
  </div>

  <div id="l8Ctx" class="ctxmenu">
    <button id="l8CopyOpt">Copy progress</button>
    <button id="l8CtxRestartOpt">Restart</button>
  </div>

  <div id="finalArea" class="final-area">
    <div class="final-spacer"></div>
    <button id="finalBtn" class="btn final-btn">CLICK ME</button>
  </div>
</div>

<div id="levelPassModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="passTitle">
  <div class="modal-card">
    <h3 id="passTitle">LEVEL PASSED!</h3>
    <div class="modal-actions">
      <button id="nextBtn" class="modal-btn">NEXT</button>
      <button id="playAgainBtn" class="modal-btn">PLAY AGAIN</button>
      <button id="levelsBtn" class="modal-btn">LEVELS</button>
    </div>
  </div>
</div>

<div id="l9FakePassModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="l9FakePassTitle">
  <div class="modal-card l9-fake-pass-card">
    <h3 id="l9FakePassTitle">LEVEL PASSED!</h3>
    <div class="modal-actions l9-fake-pass-actions">
      <button id="l9FakeNextBtn" class="modal-btn">NEXT</button>
    </div>
  </div>
</div>

<div id="globalToast" class="global-toast"></div>
<div id="restartOverlay" class="restart-overlay hidden" aria-hidden="true"></div>

<script src="script.js"></script>

</body>
</html>
